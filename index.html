<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="panel" aria-label="Snake game">
      <div class="hud">
        <div>
          <p class="label">Score</p>
          <p class="value" id="score">0</p>
        </div>
        <button class="restart-button" id="restart-button" type="button">Restart</button>
      </div>

      <p class="status" id="status">Use arrow keys or WASD to play.</p>

      <div
        id="board"
        class="board"
        role="grid"
        aria-label="Snake board"
        aria-live="polite"
      ></div>

      <div class="controls" aria-label="Touch controls">
        <button class="control-button" type="button" data-direction="up">Up</button>
        <div class="controls-row">
          <button class="control-button" type="button" data-direction="left">Left</button>
          <button class="control-button" type="button" data-direction="down">Down</button>
          <button class="control-button" type="button" data-direction="right">Right</button>
        </div>
      </div>
    </section>
  </main>

  <script src="src/snake-logic.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
